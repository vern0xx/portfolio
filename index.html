// ===== LOGGING =====
function log(t, m) {
  logs.push({ t: t, m: m, ts: new Date().toLocaleTimeString('pl') });
  if (logs.length > 50) logs.shift();
  var e = document.getElementById('DBL');
  if (e) {
    e.innerHTML = logs.map(function(l) {

    e.scrollTop = e.scrollHeight;

// ===== FIREBASE REST API =====
function fbUrl(p) {
  return FB.replace(/\/$/, '') + '/' + (p || '') + '.json';
}

async function fbGet(p) {
  var r = await fetch(fbUrl(p), { cache: 'no-cache' });
  if (!r.ok) throw new Error('GET ' + r.status + ' ' + r.statusText);
  return r.json();
}

async function fbPut(p, d) {
  var r = await fetch(fbUrl(p), {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(d)
  });
  if (!r.ok) {
    var tx = await r.text();
    throw new Error('PUT ' + r.status + ': ' + tx);
  }
  return r.json();
}

// ===== DATABASE LOAD — FIREBASE FIRST =====
async function loadDB() {
  setLd('Łączenie z Firebase...', 20);

  if (!FB) {
    log('warn', 'Brak Firebase URL!');
    loadLocal();
    return;
  }

  try {
    log('info', 'Pobieranie...');
    setLd('Pobieranie...', 55);

    var d = await fbGet('portfolio');

    if (d && (d.projects || d.reviews || d.teams)) {
      // Firebase ma dane — użyj ich
      DB = mg(d);
      localStorage.setItem('v_db', JSON.stringify(DB));
      dbOk = true;
      log('ok', '✓ Firebase OK! P:' + DB.projects.length +
          ' R:' + DB.reviews.length + ' T:' + DB.teams.length);

    } else if (d === null) {
      // Baza Firebase jest pusta (pierwszy raz)
      var local = null;
      try {
        local = JSON.parse(localStorage.getItem('v_db') || 'null');
      } catch (e) {}

      if (local && local.projects && local.projects.length > 0) {
        // Mamy lokalne dane — wyślij je do Firebase
        DB = mg(local);
        await fbPut('portfolio', DB);
        dbOk = true;
        log('ok', '✓ Wysłano lokalne dane do Firebase');
      } else {
        // Naprawdę pierwsze uruchomienie — użyj DEMO
        DB = JSON.parse(JSON.stringify(DEMO));
        await fbPut('portfolio', DB);
        dbOk = true;
        log('ok', '✓ Zainicjalizowano DEMO');
      }
      localStorage.setItem('v_db', JSON.stringify(DB));

    } else {
      // Firebase zwróciło coś, ale bez pełnych danych
      DB = mg(d);
      localStorage.setItem('v_db', JSON.stringify(DB));
      dbOk = true;
      log('ok', '✓ Dane częściowe');
    }

  } catch (e) {
    log('er', '✗ Firebase: ' + e.message);
    dbOk = false;
    log('warn', 'Fallback na localStorage...');
    loadLocal();
  }
}

// ===== LOCAL FALLBACK =====
function loadLocal() {
  try {
    var l = JSON.parse(localStorage.getItem('v_db') || 'null');
    if (l && l.projects && l.projects.length) {
      DB = mg(l);
      log('ok', 'Cache OK');
    } else {
      DB = JSON.parse(JSON.stringify(DEMO));
      log('info', 'Demo data');
    }
  } catch (e) {
    DB = JSON.parse(JSON.stringify(DEMO));
  }
}

// ===== MERGE / SANITIZE =====
function mg(d) {
  return {
    projects: Array.isArray(d.projects) ? d.projects : [],
    reviews: Array.isArray(d.reviews) ? d.reviews : [],
    teams: Array.isArray(d.teams) ? d.teams : [],
    submissions: Array.isArray(d.submissions) ? d.submissions : []
  };
}

// ===== SAVE — DEBOUNCED =====
var svT = null;
async function saveDB() {
  localStorage.setItem('v_db', JSON.stringify(DB));
  if (!FB) return false;

  return new Promise(function(res) {
    clearTimeout(svT);
    svT = setTimeout(async function() {
      if (saving) {
        log('warn', 'Save już w toku, skip');
        res(false);
        return;
      }
      saving = true;
      try {
        log('info', 'Zapisywanie do Firebase...');
        await fbPut('portfolio', DB);
        dbOk = true;
        log('ok', '✓ Zapisano do Firebase!');
        res(true);
      } catch (e) {
        log('er', '✗ Save error: ' + e.message);
        dbOk = false;
        res(false);
      } finally {
        saving = false;
      }
    }, 300);
  });
}

// ===== UTILS =====
function gId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
}

function ec(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function ea(s) {
  if (!s) return '';
  return s.replace(/[&"'<>]/g, function(c) {
    return { '&': '&amp;', '"': '&quot;', "'": '&#39;', '<': '&lt;', '>': '&gt;' }[c];
  });
}

function setLd(t, p) {
  var e = document.getElementById('LDT');
  var b = document.getElementById('LDB');
  if (e) e.textContent = t;
  if (b) b.style.width = (p || 0) + '%';
}

function toast(m, t) {
  var el = document.getElementById('TST');
  var sp = document.getElementById('TM');
  sp.textContent = m;
  el.className = 'toast ' + (t || 'ok');
  el.querySelector('i').className = 'fas ' + (
    { ok: 'fa-check-circle', er: 'fa-exclamation-circle', warn: 'fa-info-circle' }[t] || 'fa-check-circle'
  );
  setTimeout(function() { el.classList.add('show'); }, 10);
  setTimeout(function() { el.classList.remove('show'); }, 3500);
}

var lbI = [], lbX = 0;

function oLB(i, x) {
  lbI = i; lbX = x;

  document.getElementById('LBCT').textContent = (lbX + 1) + '/' + lbI.length;

  document.body.style.overflow = 'hidden';
}

function cLB() {
  document.getElementById('LB').classList.remove('act');
  document.body.style.overflow = '';
}

function nLB(d) {
  lbX = (lbX + d + lbI.length) % lbI.length;
  var i = document.getElementById('LBI');
  i.style.animation = 'none';
  i.offsetHeight; // force reflow
  i.style.animation = 'lbZ .35s var(--ease)';
  i.src = lbI[lbX];
  document.getElementById('LBCT').textContent = (lbX + 1) + '/' + lbI.length;
}

document.getElementById('LB').onclick = function(e) {
  if (e.target === e.currentTarget) cLB();
};

document.addEventListener('keydown', function(e) {
  if (!document.getElementById('LB').classList.contains('act')) return;
  if (e.key === 'Escape') cLB();
  if (e.key === 'ArrowLeft') nLB(-1);
  if (e.key === 'ArrowRight') nLB(1);
});

// ===== PORTFOLIO RENDER =====
function rPort() {
  var g = document.getElementById('PG');
  g.innerHTML = '';

  if (!DB.projects.length) {
    g.innerHTML = '<p style="text-align:center;color:var(--text3);padding:3rem;grid-column:1/-1">Brak projektów</p>';
    return;
  }

  DB.projects.forEach(function(x) {
    var h = x.image && x.image.length > 50;
    var el = document.createElement('div');
    el.className = 'pc card';

    var s = document.createElement('div'); s.className = 'cs';
    var gl = document.createElement('div'); gl.className = 'cg';
    el.appendChild(s);
    el.appendChild(gl);

    var t = document.createElement('div'); t.className = 'pt';

    if (h) {
      var im = document.createElement('img');
      im.src = x.image; im.alt = x.name; im.loading = 'lazy';
      t.appendChild(im);

      var ov = document.createElement('div'); ov.className = 'ov';
      var b = document.createElement('button'); b.className = 'ob';
      b.innerHTML = '<i class="fas fa-search-plus"></i> Zoom';

      (function(id) {
        b.onclick = function(e) { e.stopPropagation(); zP(id); };
        t.onclick = function() { zP(id); };
      })(x.id);

      ov.appendChild(b);
      t.appendChild(ov);
    } else {
      var ic = document.createElement('i');
      ic.className = (x.icon || 'fas fa-folder') + ' ti2';
      t.appendChild(ic);
    }

    var inf = document.createElement('div'); inf.className = 'pinf';
    var h3 = document.createElement('h3'); h3.textContent = x.name;
    var p = document.createElement('p'); p.textContent = x.desc || '';
    var tg = document.createElement('div'); tg.className = 'tags';

    (x.tags || []).forEach(function(tt) {
      var sp = document.createElement('span');
      sp.className = 'tag'; sp.textContent = tt;
      tg.appendChild(sp);
    });

    inf.appendChild(h3);
    inf.appendChild(p);
    inf.appendChild(tg);
    el.appendChild(t);
    el.appendChild(inf);
    g.appendChild(el);
  });
}

function zP(id) {
  var imgs = DB.projects
    .filter(function(x) { return x.image && x.image.length > 50; })
    .map(function(x) { return x.image; });
  var it = DB.projects.find(function(x) { return x.id === id; });
  if (it && it.image) {
    oLB(imgs, Math.max(0, imgs.indexOf(it.image)));
  }
}

// ===== REVIEWS — INFINITE SCROLL =====
function rRev() {
  var r = DB.reviews;
  var track = document.getElementById('RT');

  if (!r || !r.length) {
    track.innerHTML = '<div class="rc2 card" style="text-align:center;padding:3rem;min-width:370px"><p style="color:var(--text3)">Brak opinii</p></div>';
    track.classList.remove('sc');
    return;
  }

  var all = r.concat(r); // duplicate for infinite loop

  track.innerHTML = all.map(function(rv) {
    var st = '';
    for (var j = 0; j < 5; j++) {
      st += j < rv.stars
        ? '<i class="fas fa-star star f"></i>'
        : '<i class="far fa-star star e"></i>';
    }
    return '<div class="rc2 card"><div class="cs"></div><div class="cg"></div>' +
      '<div class="rs">' + st + '</div>' +
      '<p class="rtx">' + ec(rv.text) + '</p>' +
      '<div class="rau"><div class="rav">' +
      (rv.avatar && rv.avatar.length > 50
        ? '<img src="' + rv.avatar + '">'
        : ec(rv.name ? rv.name[0] : '?')) +
      '</div><div><div class="rna">' + ec(rv.name) + '</div>' +
      '<div class="rrl">' + ec(rv.role) + '</div></div></div></div>';
  }).join('');

  var dur = r.length * (390 + 24) / 40;
  track.style.setProperty('--dur', dur + 's');
  track.classList.add('sc');
}

    f.innerHTML = '';
    return;
  }

  g.innerHTML = DB.teams.map(function(x) {
    var tH = (x.tags || []).map(function(t) {
      return '<span class="tt">' + ec(t) + '</span>';
    }).join('');
    var mH = x.members
      ? '<div class="tm"><i class="fas fa-users"></i> ' + ec(x.members) + ' członków</div>'
      : '';

    return '<a href="' + ea(x.link) + '" target="_blank" rel="noreferrer" class="tc card ' + (x.style || 'tdf') + '">' +
      '<div class="cs"></div><div class="cg"></div>' +
      '<div class="th"><div class="tlo">' +
      (x.icon && x.icon.length > 50 ? '<img src="' + x.icon + '">' : (x.logo || x.name[0])) +
      '</div><div><div class="tn">' + ec(x.name) + '</div>' +
      '<div class="tr2">' + ec(x.role) + '</div></div></div>' +
      '<p class="td">' + ec(x.desc || '') + '</p>' +
      (tH ? '<div class="tts">' + tH + '</div>' : '') + mH +
      '<div class="tj"><i class="fab fa-discord"></i> Dołącz <i class="fas fa-arrow-right" style="font-size:.55rem"></i></div></a>';
  }).join('');

  f.innerHTML = DB.teams.map(function(x) {
    return '<li><a href="' + ea(x.link) + '" target="_blank"><i class="fas fa-chevron-right" style="font-size:.45rem"></i> ' + ec(x.name) + '</a></li>';
  }).join('');
}

var PIN = '2137', sC = 0, sT2;

document.getElementById('SB').onclick = function() {
  sC++;
  clearTimeout(sT2);
  sT2 = setTimeout(function() { sC = 0; }, 2000);

document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.shiftKey && e.key === 'A') {
    e.preventDefault();
    oAuth();
  }
});

function oAuth() {
  document.getElementById('AO').classList.add('act');
  document.getElementById('AE').style.display = 'none';
  var inp = document.querySelectorAll('#CI input');
  inp.forEach(function(x) { x.value = ''; });
  setTimeout(function() { inp[0].focus(); }, 100);
}

document.querySelectorAll('#CI input').forEach(function(inp, i, arr) {
  inp.oninput = function() {
    inp.value = inp.value.replace(/\D/g, '');
    if (inp.value && i < arr.length - 1) arr[i + 1].focus();
    if (i === arr.length - 1 && inp.value) vC();
  };
  inp.onkeydown = function(e) {
    if (e.key === 'Backspace' && !inp.value && i > 0) {
      arr[i - 1].focus();
      arr[i - 1].value = '';
    }
    if (e.key === 'Enter') vC();
  };
  inp.onpaste = function(e) {
    e.preventDefault();
    var p = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').substr(0, 4);
    p.split('').forEach(function(ch, ci) { if (arr[ci]) arr[ci].value = ch; });
    if (p.length === 4) vC();
  };
});

function vC() {
  var inp = document.querySelectorAll('#CI input');
  var code = Array.from(inp).map(function(i) { return i.value; }).join('');

  if (code === PIN) {
    document.getElementById('AO').classList.remove('act');
    document.getElementById('AP').classList.add('act');
    document.body.style.overflow = 'hidden';
    rAdm();
    toast('Zalogowano!', 'ok');
  } else {
    document.getElementById('AE').style.display = 'flex';
    inp.forEach(function(x) {
      x.value = '';
      x.style.borderColor = '#ef4444';
      setTimeout(function() { x.style.borderColor = ''; }, 1200);
    });
    inp[0].focus();
    var d = document.querySelector('.ad');
    d.style.animation = 'none';
    d.offsetHeight;
    d.style.animation = 'shake .4s';
  }
}

async function rstFB() {

    var d = await fbGet('portfolio');

// ===== IMAGE UPLOAD =====
function hI(e) {
  var f = e.target.files[0];
  if (!f) return;
  if (f.size > 2 * 1024 * 1024) { toast('Max 2MB!', 'er'); return; }

  var img = new Image();
  var rd = new FileReader();

  rd.onload = function(ev) {
    img.onload = function() {
      var c = document.createElement('canvas');
      var w = img.width, h = img.height;
      if (w > 1200) { h *= 1200 / w; w = 1200; }
      if (h > 800) { w *= 800 / h; h = 800; }
      c.width = w;
      c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      mImg = c.toDataURL('image/webp', 0.75);
      document.getElementById('IPV').src = mImg;
      document.getElementById('UA').classList.add('has');
      toast(Math.round(mImg.length / 1024) + 'KB OK', 'ok');
    };
    img.src = ev.target.result;
  };
  rd.readAsDataURL(f);
}

function rI(e) {
  e.preventDefault();
  e.stopPropagation();
  mImg = '';
  document.getElementById('IPV').src = '';
  document.getElementById('UA').classList.remove('has');
}

// ===== PARTICLES =====
var cv = document.getElementById('particles');
var cx = cv.getContext('2d');
var pts = [];
var mPos = { x: null, y: null };
var aId;
var noMo = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
var mob = innerWidth < 768;

function rCv() { cv.width = innerWidth; cv.height = innerHeight; }
rCv();

function Pt() {
  this.x = Math.random() * cv.width;
  this.y = Math.random() * cv.height;
  this.s = Math.random() * 1.5 + 0.3;
  this.vx = (Math.random() - 0.5) * 0.12;
  this.vy = (Math.random() - 0.5) * 0.12;
  this.o = Math.random() * 0.18 + 0.04;
  this.od = Math.random() > 0.5 ? 1 : -1;
  this.h = Math.random() * 30 + 265;
}

Pt.prototype.u = function() {
  this.x += this.vx;
  this.y += this.vy;
  if (mPos.x !== null) {
    var dx = mPos.x - this.x;
    var dy = mPos.y - this.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < 100) {
      var f = (100 - d) / 100;
      this.x -= (dx / d) * f * 0.5;
      this.y -= (dy / d) * f * 0.5;
    }
  }
  this.o += 0.0006 * this.od;
  if (this.o >= 0.22) this.od = -1;
  if (this.o <= 0.04) this.od = 1;
  if (this.x < -5) this.x = cv.width + 5;
  if (this.x > cv.width + 5) this.x = -5;
  if (this.y < -5) this.y = cv.height + 5;
  if (this.y > cv.height + 5) this.y = -5;
};

Pt.prototype.d = function() {
  cx.beginPath();
  cx.arc(this.x, this.y, this.s, 0, Math.PI * 2);
  cx.fillStyle = 'hsla(' + this.h + ',45%,48%,' + this.o + ')';
  cx.fill();
};

function iP() {
  pts = [];
  if (noMo) return;
  var c = mob ? 12 : Math.min(Math.floor(cv.width * cv.height / 20000), 70);
  for (var i = 0; i < c; i++) pts.push(new Pt());
}

function dCn() {
  for (var i = 0; i < pts.length; i++) {
    for (var j = i + 1; j < pts.length; j++) {
      var dx = pts[i].x - pts[j].x;
      var dy = pts[i].y - pts[j].y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < 65) {
        cx.beginPath();
        cx.moveTo(pts[i].x, pts[i].y);
        cx.lineTo(pts[j].x, pts[j].y);
        cx.strokeStyle = 'hsla(270,30%,35%,' + (1 - d / 65) * 0.03 + ')';
        cx.lineWidth = 0.3;
        cx.stroke();
      }
    }
  }
}

function anm() {
  cx.clearRect(0, 0, cv.width, cv.height);
  pts.forEach(function(p) { p.u(); p.d(); });
  dCn();
  aId = requestAnimationFrame(anm);
}

iP();
if (!noMo) anm();

  if (cRing) { cRing.style.left = (rx - 20) + 'px'; cRing.style.top = (ry - 20) + 'px'; }

}

var skO = new IntersectionObserver(function(e) {
  e.forEach(function(en) {
    if (en.isIntersecting) {
      document.querySelectorAll('.skf').forEach(function(b) {
        b.style.width = b.dataset.w + '%';
      });
      skO.unobserve(en.target);
    }
  });
}, { threshold: 0.2 });

// ===== REVEAL ON SCROLL =====
var rvO = new IntersectionObserver(function(e) {
  e.forEach(function(en) {
    if (en.isIntersecting) {
      en.target.classList.add('v');
      rvO.unobserve(en.target);
    }
  });
}, { threshold: 0.05 });

document.querySelectorAll('.rv,.stg').forEach(function(el) {
  rvO.observe(el);
});

// ===== SMOOTH SCROLL LINKS =====
document.querySelectorAll('a[href^="#"]').forEach(function(a) {
  a.onclick = function(e) {
    e.preventDefault();
    var t = document.querySelector(a.getAttribute('href'));
    if (t) t.scrollIntoView({ behavior: 'smooth' });
  };
});

// ===== NAME SCRAMBLE EFFECT =====
var hN = document.getElementById('HN');
var oN = 'Vern0x';

hN.onmouseenter = function() {
  var it = 0;
  var ch = '!@#$%^&*01_-+=<>~';
  var iv = setInterval(function() {
    hN.textContent = oN.split('').map(function(c, i) {
      return i < it ? oN[i] : ch[Math.floor(Math.random() * ch.length)];
    }).join('');
    if (it >= oN.length) clearInterval(iv);
    it += 0.3;
  }, 30);
};

// ===== TITLE SCRAMBLE =====
document.querySelectorAll('.st2').forEach(function(tl) {
  var o = tl.textContent;
  var p = false;
  new IntersectionObserver(function(e) {
    e.forEach(function(en) {
      if (en.isIntersecting && !p) {
        p = true;
        var it = 0;
        var ch = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        var iv = setInterval(function() {
          tl.textContent = o.split('').map(function(c, i) {
            return c === ' ' ? ' ' : i < it ? o[i] : ch[Math.floor(Math.random() * ch.length)];
          }).join('');
          if (it >= o.length) clearInterval(iv);
          it += 0.4;
        }, 28);
      }
    });
  }, { threshold: 0.3 }).observe(tl);
});
